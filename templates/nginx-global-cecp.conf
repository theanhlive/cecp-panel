# CECP Panel — global nginx tuning (include in http via conf.d)
# Rate limit is for dynamic PHP / HTML only (see vhost). Static assets are exempt.
# 40r/s + burst covers normal WP page loads without 503 on images/CSS/JS.
limit_req_zone $binary_remote_addr zone=cecp_general:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=cecp_conn:10m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml font/woff2;

# FastCGI cache zone (WordPress — bypass for logged-in / cart via site config)
fastcgi_cache_path /var/cache/nginx/cecp levels=1:2 keys_zone=CECP_WP:64m inactive=60m max_size=512m use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$request_uri";
fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
fastcgi_cache_lock on;
