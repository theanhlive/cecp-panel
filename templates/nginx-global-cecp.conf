# CECP Panel — shared http-context config (conf.d). Managed by cecp-panel; edits are overwritten.
# Rate limit is for dynamic PHP / HTML only (see vhost). Static assets are exempt.
# 40r/s + burst covers normal WP page loads without errors on images/CSS/JS.
limit_req_zone $binary_remote_addr zone=cecp_general:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=cecp_conn:10m;
limit_req_status 429;
limit_conn_status 429;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/javascript application/javascript application/json application/ld+json
           application/manifest+json application/xml application/rss+xml application/xml+rss text/xml image/svg+xml;

# "combined" prefix (fail2ban filters keep matching) + timing and cache status for `optimize report`.
log_format cecp '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" rt=$request_time cs=$upstream_cache_status';

# FastCGI micro-cache (WordPress). The key drops ad/analytics tracking parameters, otherwise
# every fbclid/gclid/utm click is a distinct URL and a guaranteed cache MISS.
map $request_uri $cecp_cache_uri {
    default $request_uri;
    "~^(?<cecp_path>[^?]*)\?(?:(?:utm_[a-z_]+|fbclid|gclid|gbraid|wbraid|dclid|msclkid|ttclid|twclid|igshid|mc_cid|mc_eid|_ga|_gl)=[^&]*&?)+$" $cecp_path;
}
fastcgi_cache_path /var/cache/nginx/cecp levels=1:2 keys_zone=CECP_WP:64m inactive=60m max_size=512m use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$cecp_cache_uri";
fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
fastcgi_cache_background_update on;
fastcgi_cache_revalidate on;
fastcgi_cache_lock on;
