# CECP Panel — security headers. Include in every server AND in every location that has its
# own add_header: nginx drops all inherited add_header directives in such a location.
# $cecp_hsts is set per server block ("" on plain HTTP, so no header is sent there).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security $cecp_hsts always;
